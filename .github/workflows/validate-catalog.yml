name: Validate marketplace and skills

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator dependency
        run: python -m pip install "PyYAML>=6,<7"
      - name: Validate catalog, skill files and Marketplace
        run: python scripts/check_catalog.py
      - name: Test cross-agent installer
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m py_compile scripts/install.py scripts/check_catalog.py
